name: Node.js CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres_acid_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Added Prisma Client Generation step prior to database push & tests
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Sync Database Schema
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/postgres_acid_db"

      - name: Run Jest Test Suite
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/postgres_acid_db"
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: super_secret_test_key_123456789